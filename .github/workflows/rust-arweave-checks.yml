on:
  pull_request:
    paths:
      - rust/apps/arweave/**

name: Arweave Checks

permissions:
  contents: read

jobs:
  UnitTest:
    name: Unit Test And Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Read Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(cat rust-toolchain)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --component rustfmt --target x86_64-apple-darwin

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run rust/apps/arweave
        run: cd rust/apps/arweave && cargo +$RUST_TOOLCHAIN llvm-cov --fail-under-regions 87 --fail-under-functions 83 --fail-under-lines 87 --ignore-filename-regex 'keystore/*|utils/*'
