on:
  pull_request:
    paths:
      - rust/apps/cosmos/**

name: Cosmos Checks

permissions:
  contents: read

jobs:
  UnitTest:
    name: Unit Test And Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Read Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(cat rust-toolchain)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --component rustfmt --target x86_64-apple-darwin

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run rust/apps/cosmos
        run: cd rust/apps/cosmos && cargo +$RUST_TOOLCHAIN llvm-cov --fail-under-regions 79 --fail-under-functions 63 --fail-under-lines 76 --ignore-filename-regex 'keystore/*|utils/*'
