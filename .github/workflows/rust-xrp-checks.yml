on:
  pull_request:
    paths:
      - rust/apps/xrp/**

name: XRP Checks

permissions:
  contents: read

jobs:
  UnitTest:
    name: Unit Test And Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2.8.0
        with:
          persist-credentials: false

      - name: Read Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(cat rust-toolchain)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --component rustfmt --target x86_64-apple-darwin

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run rust/apps/xrp
        run: cd rust/apps/xrp && cargo +$RUST_TOOLCHAIN llvm-cov --fail-under-regions 84 --fail-under-functions 90 --fail-under-lines 93 --ignore-filename-regex 'keystore/*|utils/*'
